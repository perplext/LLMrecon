name: Go Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: Gosec Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.29.0
        with:
          # Excluded rules (with rationale). The v2.27.1 bump (#256) enabled
          # several analyzers that fire systematically against this tool's
          # nature; they are accepted at the rule level here. Security-meaningful
          # rules (G101/G117/G204/G304/G123/...) stay ON and are reviewed
          # per-site with inline `#nosec <rule> -- reason` annotations.
          #   G201/G115/G302 - pre-existing (format-string, int-overflow, file-perm) false positives
          #   G118 - goroutine uses context.Background: background workers in a CLI; not a security finding
          #   G122 - filepath.Walk TOCTOU: operations over the operator's own local files
          #   G703 - path-traversal taint on operator-supplied paths (same surface as the per-site-reviewed G304)
          #   G705 - XSS taint in examples/ demo HTTP servers, not product code
          #   G706 - log-injection (LOW) on operator-supplied identifiers
          args: '-exclude=G201,G115,G302,G118,G122,G703,G705,G706 -fmt sarif -out gosec-results.sarif ./...'
          
      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'
          
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./... || echo "Some vulnerabilities found, see output above"

  honesty-lint:
    name: Honesty Lint
    runs-on: ubuntu-latest
    # Diff-scoped: only meaningful against a PR base. Catches a newly-added
    # `return nil` next to a TODO/FIXME (a stub that claims success) — #233.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so merge-base with the PR base resolves

      - name: Run honesty lint
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/honesty_lint.py --base "origin/${BASE_REF}"

      # Guard against the worst-of-both-worlds //go:build ignore files in
      # src/cmd/: they show up in greps, rot uncovered, and confuse readers.
      # Finish them or attic them — never leave them build-ignored (#226).
      - name: Guard against //go:build ignore in src/cmd
        run: |
          matches=$(grep -rl "go:build ignore" src/cmd/ 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::src/cmd/ must not contain //go:build ignore files. Finish them or attic them (see #226):"
            echo "$matches"
            exit 1
          fi
          echo "OK: no //go:build ignore files in src/cmd/"