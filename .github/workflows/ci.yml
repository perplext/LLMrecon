name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install PyTorch CPU version first (for CI efficiency)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu || true
          # Install other ML dependencies
          pip install numpy pandas scikit-learn transformers || true
          pip install gym stable-baselines3 || true
          pip install Pillow opencv-python || true
          pip install scipy networkx tqdm pyyaml || true
          
      - name: Run Python tests
        run: |
          echo "Running Python module tests..."
          python -c "import sys; sys.path.insert(0, '.'); from ml.agents.multi_armed_bandit import MultiArmedBanditOptimizer; print('✓ Multi-armed bandit module loads')"
          python -c "import sys; sys.path.insert(0, '.'); from ml.data.attack_data_pipeline import AttackDataPipeline; print('✓ Attack data pipeline module loads')"
          echo "Python tests passed!"

  javascript-test:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript files..."
          find . -name "*.js" -type f | while read file; do
            node --check "$file" || echo "Warning: $file has syntax issues"
          done
          echo "JavaScript check complete!"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check documentation
        run: |
          echo "Checking documentation..."
          if [ -f "README.md" ]; then
            echo "✓ README.md exists"
          fi
          if [ -f "CLAUDE.md" ]; then
            echo "✓ CLAUDE.md exists"
          fi
          if [ -d "docs" ]; then
            echo "✓ docs directory exists"
            ls -la docs/
          fi
          echo "Documentation check complete!"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  go-analysis:
    name: Go Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: |
          go mod download || echo "No go.mod found or download failed"
          
      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -race -count=1 ./...

      - name: Check Go formatting
        run: |
          if [ -n "$(gofmt -l src/)" ]; then
            echo "The following files need formatting:"
            gofmt -l src/
          else
            echo "All Go files are properly formatted"
          fi

  verify-drift:
    # Per v0.10.0 plan #169: detect drift between derived artifacts and
    # their sources of truth. CI shares the implementation with `make
    # verify-drift` via scripts/verify-drift.sh — single source of truth
    # for both local and CI runs.
    name: Verify Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run drift checks
        run: bash scripts/verify-drift.sh